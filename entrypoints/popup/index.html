<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MarkSync</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app">
      <header class="app-header">
        <img src="/icon/48.png" alt="" width="28" height="28" />
        <h1>MarkSync</h1>
      </header>

      <p id="message" class="message" hidden></p>

      <!-- Setup view: shown when sync is not enabled -->
      <form id="setup" hidden>
        <label>
          Service URL
          <input
            id="service-url"
            type="url"
            value="https://api.xbrowsersync.org"
            required
            autocomplete="off"
          />
        </label>
        <p class="field-hint">
          Need a server?
          <a
            id="public-servers-link"
            href="https://marksync.org/#services"
            target="_blank"
            rel="noopener noreferrer"
          >
            Browse public sync servers ↗
          </a>
        </p>

        <!-- A select rather than a radio group: the two read the same, and a popup is
             capped at the browser's height ceiling, which the bordered fieldset and its
             legend were spending on nothing the label does not already say. -->
        <label>
          Sync
          <select id="setup-mode">
            <option value="new">Create a new sync</option>
            <option value="existing">Use an existing sync ID</option>
          </select>
        </label>

        <label id="sync-id-field" hidden>
          Sync ID
          <input id="sync-id" type="text" autocomplete="off" spellcheck="false" />
        </label>

        <label>
          Password
          <input id="password" type="password" required autocomplete="off" />
        </label>

        <label>
          Sync direction
          <select id="setup-direction">
            <option value="two-way">Two-way (send and receive)</option>
            <option value="push-only">Send only (source)</option>
            <option value="pull-only">Receive only (mirror)</option>
          </select>
        </label>
        <!-- Spells out which side's bookmarks survive the first exchange: that depends on
             the direction *and* on whether a sync is being created or joined, and it is
             the one step the user cannot undo by changing the setting afterwards. -->
        <p class="field-hint" id="setup-direction-hint" hidden></p>

        <button id="enable" type="submit">Enable sync</button>
      </form>

      <!-- Status view: shown when sync is enabled -->
      <section id="status" hidden>
        <!-- Description and tags for the page in the active tab. No browser can store
             either on a bookmark, so they live in the sync alongside it; this is where
             they are edited. Hidden for pages that cannot be bookmarked into a sync
             (the extension's own pages, about:/chrome:// URLs, and so on). -->
        <form id="page-meta" class="page-meta" hidden>
          <h2>This page</h2>
          <p id="page-meta-title" class="page-meta-title"></p>
          <p id="page-meta-hint" class="field-hint" hidden></p>

          <label>
            Description
            <textarea id="page-description" rows="2" spellcheck="true"></textarea>
          </label>
          <p id="page-description-count" class="field-hint"></p>

          <label>
            Tags
            <input
              id="page-tags"
              type="text"
              placeholder="comma, separated"
              autocomplete="off"
              spellcheck="false"
            />
          </label>

          <button id="page-meta-save" type="submit">Save</button>
        </form>

        <dl>
          <dt>Service</dt>
          <dd id="status-service">
            <span id="status-service-url"></span>
            <!-- Glyph + colour are the only visual cue, so main.ts sets an aria-label
                 naming the service state for assistive technology. -->
            <span id="status-service-badge" class="badge" role="img" hidden></span>
          </dd>
          <dt>Sync ID</dt>
          <dd id="status-sync-id" class="monospace"></dd>
          <dt>Last updated</dt>
          <dd id="status-last-updated"></dd>
          <!-- Both halves are hidden together: a <dt> with no <dd> reads as an empty
               term to a screen reader. Shown only when the sync is one-way. -->
          <dt id="status-direction-row" hidden>Direction</dt>
          <dd id="status-direction" hidden></dd>
        </dl>

        <p id="service-message" class="service-message" hidden></p>

        <div id="data-usage" class="data-usage" hidden>
          <div class="data-usage-header">
            <span>Data usage</span>
            <span id="data-usage-percent"></span>
          </div>
          <div class="data-usage-bar">
            <div id="data-usage-fill" class="data-usage-fill"></div>
          </div>
          <p id="data-usage-detail" class="data-usage-detail"></p>
        </div>

        <button id="toggle-qr" type="button" class="secondary" aria-expanded="false">
          Show QR code
        </button>
        <figure id="qr" class="qr" hidden>
          <div id="qr-canvas" class="qr-canvas" role="img" aria-label="Sync ID QR code"></div>
          <figcaption>Scan to copy this sync ID to another device.</figcaption>
        </figure>
        <div class="actions">
          <button id="sync-now" type="button">Update Sync</button>
          <button id="disable" type="button" class="secondary">Disable Sync</button>
        </div>
      </section>

      <button id="open-options" type="button" class="secondary">Settings, backup &amp; logs</button>

      <!-- Below the settings button so the view's own primary action (Enable sync /
           Sync now) is never flanked by a second accent button. -->
      <a
        id="site-link"
        class="button site-link"
        href="https://app.marksync.org"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open the MarkSync web app
        <span aria-hidden="true">↗</span>
      </a>

      <p id="build-info" class="build-info"></p>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
