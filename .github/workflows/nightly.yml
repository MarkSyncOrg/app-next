name: Nightly Build

# Nightlies are built from the schedule alone — 01:00 UTC, once a day — and never on
# merge to main, so a busy day yields one build instead of one per merge. A build needed
# out of band is a workflow_dispatch away.
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      skip_store_upload:
        description: 'Build the nightly release without uploading it to the store test channels'
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

# Token for installing @marksyncorg/core from GitHub Packages.
env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # A nightly is only worth building when main has moved since the last one, so
  # compare HEAD against the commit the most recent nightly release was tagged at.
  # Manual runs always build, so a nightly can be forced without a dummy commit.
  check:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Compare HEAD with the last published nightly
        id: check
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run: building regardless of changes."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Releases come back newest first, so the first nightly-* one is the previous build.
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq 'map(select(.draft | not) | select(.tag_name | startswith("nightly-"))) | first | .tag_name // ""')
          if [ -z "$tag" ]; then
            echo "No published nightly yet: building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" 2>/dev/null || true)
          if [ -z "$ref" ]; then
            echo "Tag ${tag} no longer exists: building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sha=$(echo "$ref" | jq -r '.object.sha')
          # Release tags are lightweight, but dereference annotated ones just in case.
          if [ "$(echo "$ref" | jq -r '.object.type')" = "tag" ]; then
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.sha')
          fi

          if [ "$sha" = "$GITHUB_SHA" ]; then
            echo "HEAD is still ${sha}, already released as ${tag}: skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "HEAD ${GITHUB_SHA} differs from ${tag} (${sha}): building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.build == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@marksyncorg'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  nightly:
    name: Package nightly builds
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write # create/update the nightly prerelease
      packages: read # install @marksyncorg/core from GitHub Packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@marksyncorg'
      - run: pnpm install --no-frozen-lockfile

      # The stores reject a version they have already accepted, so a nightly cannot ship
      # the package version — that one only moves on release. A nightly is the package's
      # major.minor with the workflow run number in the third slot, giving `2.0.<run>`:
      # the run number is monotonic across the workflow's whole history and never resets,
      # so every nightly is unique and newer than the last, and 0–65535 leaves far more
      # room than the schedule can spend. Read by wxt.config.ts, so the manifest and the
      # zip filenames agree.
      #
      # The cost of the short form is that the nightly occupies the patch component, so
      # there are no patch releases to hand out while nightlies publish: a stable release
      # has to bump at least the minor (2.0.412 → 2.1.0), because anything in the 2.0
      # series now sorts below the nightlies. See "Publishing" in README.md.
      - name: Compute the nightly version
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          # major.minor, dropping any prerelease suffix: browsers only accept plain numbers.
          series=$(node -p "require('./package.json').version.split('-')[0].split('.').slice(0, 2).join('.')")
          {
            echo "RELEASE_VERSION=${package_version}"
            echo "NIGHTLY_VERSION=${series}.${GITHUB_RUN_NUMBER}"
            echo "WXT_EXTENSION_VERSION=${series}.${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_ENV"

      - name: Package Chromium
        run: pnpm zip
      - name: Package Firefox
        run: pnpm zip:firefox

      # Releases are immutable once published: assets can only be uploaded while the
      # release is still a draft, and a published release (and its tag) can never be
      # modified or reused. So each nightly gets its own tag, is created as a draft to
      # receive its assets, and is then flipped to published.
      #
      # The tag names the commit that was built. Rebuilding a commit that already has
      # a nightly (a forced manual run, or main rolled back to an earlier commit) would
      # collide with that frozen release, so fall back to a run-suffixed tag.
      - name: Compute build identifiers
        run: |
          set -euo pipefail
          short_sha=${GITHUB_SHA::7}
          tag="nightly-${short_sha}"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; disambiguating with the run number."
            tag="${tag}-${GITHUB_RUN_NUMBER}"
          fi
          {
            echo "SHORT_SHA=${short_sha}"
            echo "RELEASE_TAG=${tag}"
            # Build time in UTC, leading the release name so the list reads (and sorts)
            # chronologically: the tag names a commit, which says nothing about when.
            echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M')"
          } >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # wxt zip names artifacts {name}-{version}-{target}.zip; a nightly is identified
      # by the commit it was built from, not by its generated version, so swap the
      # version for the short sha before uploading.
      - name: Stamp artifact names with the commit sha
        run: |
          for f in .output/*-"${NIGHTLY_VERSION}"-*.zip; do
            mv "$f" "${f/-${NIGHTLY_VERSION}-/-nightly-${SHORT_SHA}-}"
          done
          ls -1 .output/*.zip

      - name: Create draft nightly release
        id: draft
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: '${{ env.BUILD_TIMESTAMP }} UTC — Nightly ${{ env.SHORT_SHA }}'
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: true
          body: |
            Automated nightly build from the `main` branch (v${{ env.RELEASE_VERSION }}).

            Built: ${{ github.sha }}
            Built at: ${{ env.BUILD_TIMESTAMP }} UTC
            Manifest version: ${{ env.NIGHTLY_VERSION }}
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-sources.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Addressed by release id: draft releases have no tag ref yet, so tag-based
      # lookups (gh release edit <tag>) cannot find them.
      - name: Publish nightly release
        run: gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}

      # Best-effort cleanup so nightlies don't pile up: keep the newest 14. Tags name
      # commits rather than dates, so age comes from the API's newest-first ordering
      # instead of sorting the names. Deleting may be blocked for immutable releases,
      # so never fail the build over it.
      - name: Prune old nightly releases
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq 'map(select(.draft | not) | select(.tag_name | startswith("nightly-"))) | .[14:][].tag_name' \
            | while read -r tag; do
            gh release delete "$tag" --yes || echo "Could not delete $tag (immutable release?); skipping"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # While there is no stable release, the nightly *is* the published extension: it
      # goes straight to both public listings, so early users get what landed on main
      # rather than nothing. That is a deliberate pre-1.0 trade — every build is
      # unreviewed code auto-updated onto every user, and each upload costs a review
      # submission on each store.
      #
      # Once a stable release exists, flip this back: set CHROME_PUBLISH_TARGET to
      # `trustedTesters` and FIREFOX_CHANNEL to `unlisted` in the upload step below, and
      # the public channels become release.yml's job alone. Nothing else has to change —
      # release.yml is already wired for it.
      #
      # Each store is uploaded to only when its credentials are present, so configuring
      # one store does not block on the other. `wxt submit` submits a store only when it
      # is given a zip, which is how the flags below select them.
      #
      # Expect this step to fail on the days a Chrome review is still open: the Web Store
      # refuses a new package while the previous one is in review ("Publish condition not
      # met"). Accepted rather than worked around — the release above is already published
      # by then, so nothing is lost, and the next nightly carries the newer commit. The
      # fix, if it becomes noise, is to upload to Chrome less often; not to swallow the
      # error, which would hide the uploads that fail for real reasons.
      - name: Check which store credentials are configured
        id: stores
        if: ${{ !inputs.skip_store_upload }}
        run: |
          set -euo pipefail
          have() { [ -n "${!1:-}" ]; }

          if have CHROME_EXTENSION_ID && have CHROME_CLIENT_ID \
            && have CHROME_CLIENT_SECRET && have CHROME_REFRESH_TOKEN; then
            echo 'chrome=true' >> "$GITHUB_OUTPUT"
          else
            echo 'chrome=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Chrome Web Store credentials are not configured; skipping the Chrome upload.'
          fi

          if have FIREFOX_EXTENSION_ID && have FIREFOX_JWT_ISSUER && have FIREFOX_JWT_SECRET; then
            echo 'firefox=true' >> "$GITHUB_OUTPUT"
          else
            echo 'firefox=false' >> "$GITHUB_OUTPUT"
            echo '::notice::AMO credentials are not configured; skipping the Firefox upload.'
          fi
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

      - name: Upload the nightly to the stores
        if: steps.stores.outputs.chrome == 'true' || steps.stores.outputs.firefox == 'true'
        run: |
          set -euo pipefail
          args=()
          if [ "${CHROME_CONFIGURED}" = 'true' ]; then
            args+=(--chrome-zip "$(echo .output/*-chrome.zip)")
          fi
          if [ "${FIREFOX_CONFIGURED}" = 'true' ]; then
            # AMO needs the sources for a bundled extension, and refuses the upload
            # without them, so the two zips always travel together.
            args+=(--firefox-zip "$(echo .output/*-firefox.zip)")
            args+=(--firefox-sources-zip "$(echo .output/*-sources.zip)")
          fi
          pnpm exec wxt submit "${args[@]}"
        env:
          CHROME_CONFIGURED: ${{ steps.stores.outputs.chrome }}
          FIREFOX_CONFIGURED: ${{ steps.stores.outputs.firefox }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          # The public audience on both stores, submitted for review — see the note
          # above for what to change once there is a stable release to protect.
          CHROME_PUBLISH_TARGET: default
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_CHANNEL: listed
          # Set the STORE_DRY_RUN repository variable to 'true' to exercise the whole
          # pipeline — credentials included — without uploading anything.
          DRY_RUN: ${{ vars.STORE_DRY_RUN }}
