# pnpm settings (pnpm 11 reads project config from here, not the package.json "pnpm" field).

# No `overrides` block, and that is a result rather than an oversight. Every pin this
# file used to carry is gone, checked one at a time by emptying the block and re-running
# `pnpm audit`:
#
#   js-yaml, postcss, nanoid, brace-expansion (x2) were transitive dependencies of an
#   older eslint and vitest. On eslint 10 / vitest 5 the tree resolves them already
#   patched.
#
#   shell-quote, tmp, uuid, adm-zip all reached the tree through wxt > web-ext-run, the
#   firefox runner. wxt 0.21 does not depend on web-ext-run at all, so that whole subtree
#   left, and with it a critical shell-quote advisory and three more.
#
#   esbuild was never a real dependency here: vite 8 declares it as an OPTIONAL peer
#   (`^0.27.0 || ^0.28.0`), and with autoInstallPeers it was being pulled in and then
#   flagged by GHSA-g7r4-m6w7-qqqr. On a full re-resolve under wxt 0.21 it is not
#   installed at all. Do not "fix" it with an override: an override rewrites the peer
#   range, and a range vite does not declare makes pnpm drop the optional peer rather
#   than upgrade it, which looks like a fix in `pnpm audit` and is really just a package
#   leaving the tree. It costs nothing here, confirmed by hashing the built output with
#   esbuild present and absent: identical, file for file.
#
# So: before adding a pin, empty this space and run `pnpm audit`. A dependency bump that
# removes the vulnerable subtree beats a pin that has to be re-read every round.

# lzutf8 (transitive, via @marksyncorg/core) writes its optional debug output with
# `document.body.innerHTML += …`. The branch is dead here — nothing ever asks it to log
# to the document — but the bundler cannot prove that, so the string ships in
# background.js and in the popup/options chunk and the AMO validator flags it as an
# unsafe innerHTML assignment. The patch keeps the same behaviour using text nodes.
# Pinned to the exact version: a lzutf8 bump fails the install until the patch is
# re-checked, rather than silently dropping it.
patchedDependencies:
  lzutf8@0.6.3: patches/lzutf8@0.6.3.patch

# HALF-CLOSED GAP. The lockfile used to carry no `patchedDependencies` section, so it
# disagreed with the block above and `pnpm install --frozen-lockfile` refused outright
# with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. That half is done: the lockfile was regenerated
# with a GitHub Packages token, it records the patch, and a frozen install now succeeds
# from a clean node_modules.
#
# The other half is not. All seven workflow installs still pass `--no-frozen-lockfile`,
# so CI, nightly and release alike re-resolve the tree from the registry instead of
# building what was reviewed, and the release job is the one that builds what ships to
# the stores. Moving them back to `--frozen-lockfile` is now a safe edit, with one
# ordering constraint: it should land only once Dependabot has actually opened an npm
# pull request here and updated this lockfile in it. Until that is observed, a Dependabot
# pull request touching package.json without the lockfile would fail CI on the mismatch
# rather than on anything real. No secret is involved any more; see the note in
# .github/dependabot.yml for why the registry block there is deliberately absent.

# Dependency lifecycle scripts pnpm may run: none. pnpm blocks them by default, and the
# two entries that used to sit here are both moot. esbuild needed its install script to
# fetch a platform binary, and it is no longer in the tree (see the note at the top);
# spawn-sync came through web-ext-run, which wxt 0.21 dropped. An empty list is the safe
# default: a dependency bump that puts a package with an install script back in the tree
# is blocked and fails loudly instead of running it unreviewed.
allowBuilds: {}

# Supply-chain cooldown: never install a package version published less than 4 days ago
# (4 * 24 * 60 = 5760 minutes), giving freshly-published (possibly compromised) releases
# time to be caught before they enter the tree. It gates new resolutions, which is what
# every CI, nightly and release install still performs while those installs pass
# `--no-frozen-lockfile` (see the gap note above). So the cooldown remains, for now, the
# only thing standing between a fresh upstream release and a build that ships.
#
# It also holds back versions this repo would otherwise take: today eslint 10.11.0 and
# prettier 3.9.8 are both inside the window, which is why the manifest names 10.10.0 and
# 3.9.6. That is the cooldown working, not a stale pin.
minimumReleaseAge: 5760

# Exempt our own first-party package from the cooldown: it is published by us to a
# private registry (not a public supply-chain risk), so new releases must install
# immediately without waiting out the window.
minimumReleaseAgeExclude:
  - '@marksyncorg/core'
